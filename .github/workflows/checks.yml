# Runs every check the agent rules require, with the tool versions pinned in each
# project's rokit.toml, so nothing depends on anyone's machine or session.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  last-ferry:
    name: Last Ferry
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/last-ferry
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install the pinned tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rokit authenticate github --token "$GITHUB_TOKEN" --skip-verify
          rokit install --no-trust-check

      - name: Format (StyLua)
        run: stylua --check ServerScriptService ReplicatedStorage tests tools

      - name: Lint (selene)
        run: |
          selene generate-roblox-std
          selene .

      - name: Type-check (luau-lsp, strict)
        run: |
          curl -sSfL -o globalTypes.None.d.luau \
            https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.70.1/scripts/globalTypes.None.d.luau
          rojo sourcemap default.project.json -o sourcemap.json
          luau-lsp analyze --definitions=globalTypes.None.d.luau --sourcemap=sourcemap.json \
            --base-luaurc=.luaurc ServerScriptService ReplicatedStorage

      - name: Tests (logic, simulated shifts, the whole game headless)
        run: lune run tests/run.luau

      - name: Build the place
        run: rojo build default.project.json -o LastFerry.rbxl

      - name: Keep the built place
        uses: actions/upload-artifact@v4
        with:
          name: LastFerry-place
          path: games/last-ferry/LastFerry.rbxl

  starter:
    name: Starter template
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install the pinned tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rokit authenticate github --token "$GITHUB_TOKEN" --skip-verify
          rokit install --no-trust-check

      - name: Format (StyLua)
        run: stylua --check ServerScriptService ReplicatedStorage

      - name: Lint (selene)
        run: |
          selene generate-roblox-std
          selene .

      - name: Type-check (luau-lsp, strict)
        run: |
          curl -sSfL -o globalTypes.None.d.luau \
            https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.70.1/scripts/globalTypes.None.d.luau
          rojo sourcemap default.project.json -o sourcemap.json
          luau-lsp analyze --definitions=globalTypes.None.d.luau --sourcemap=sourcemap.json \
            --base-luaurc=.luaurc ServerScriptService ReplicatedStorage

      - name: Build a place
        run: rojo build default.project.json -o Starter.rbxl
